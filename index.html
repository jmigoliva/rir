<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Video App</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

/* Remove scroll e comportamento de app */
body {
    position: fixed;
    inset: 0;
}

/* Vídeo fullscreen */
iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    border: none;
}
</style>
</head>

<body>

<iframe
src="https://www.youtube.com/embed/M_5BIC_RMc4?autoplay=1&mute=1&controls=0&playsinline=1&loop=1&playlist=M_5BIC_RMc4"
allow="autoplay; encrypted-media"
allowfullscreen>
</iframe>

</body>
</html>
